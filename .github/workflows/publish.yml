# 发布 superpowers-dsh 到 npm 官方仓库。
#
# 用 npm Trusted Publishing（GitHub OIDC）发布：不需要任何本地 NODE_AUTH_TOKEN，
# 不依赖你这台机器的网络能不能连上 registry.npmjs.org，也没有 token 过期问题。
#
# 一次性配置（在 npm 网页上，用 zsqt 账号登录）：
#   https://www.npmjs.com/package/superpowers-dsh/access
#   → Trusted publishing → Add a publisher → GitHub
#     Organization or user: LayneChai
#     Repository:           superpowers-dsh
#     Workflow filename:    publish.yml
#     Environment:          (留空)
#
# 之后每次发布：
#   1. 改 package.json 的 version（例如 0.2.0 → 0.2.1）
#   2. git commit && git push
#   3. git tag v0.2.1 && git push origin v0.2.1     ← 触发本 workflow
#   4. 需要手动重跑时，在 Actions 页面 workflow_dispatch 即可
#
# 注意：tag 名 vX.Y.Z 必须与 package.json 里的 version 完全一致，否则下面
# 的校验步骤会直接失败，避免把旧版本重复发出去。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Trusted Publishing 需要较新的 npm（OIDC 交换由 CLI 自己完成）
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Use the newest npm
        run: npm install -g npm@latest

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (tag !== pkg.version) {
              console.error('tag ' + tag + ' != package.json version ' + pkg.version);
              process.exit(1);
            }
          "

      - name: Verify skills and profile compatibility
        run: |
          node scripts/verify-skills.mjs
          node scripts/check-dsh-compat.mjs

      - name: Publish
        run: |
          set -o pipefail
          PKG=$(node -p "require('./package.json').name")
          V=$(node -p "require('./package.json').version")
          echo "npm: $(npm --version)  node: $(node --version)"
          echo "registry: $(npm config get registry)"
          echo "package: $PKG@$V"

          if npm publish --access public --provenance --loglevel verbose >/tmp/publish.log 2>&1; then
            echo "npm publish exited 0"
            tail -n 25 /tmp/publish.log
            exit 0
          fi

          echo "npm publish exited non-zero"

          # Re-pushing an existing tag must not paint the repo red if the
          # version that tag names is already the one on the registry — that is
          # the state the tag is asking for, already achieved. Decide this
          # before emitting diagnostics so a satisfied run carries no
          # failure annotations.
          if grep -q 'cannot publish over the previously published versions' /tmp/publish.log \
             && [ "$(npm view "$PKG@$V" version 2>/dev/null)" = "$V" ]; then
            echo "::warning::$PKG@$V is already on the registry; nothing to publish"
            exit 0
          fi

          # Real failure: npm's own error block first, then a tail as fallback.
          grep -E 'npm (error|ERR)|E4[0-9][0-9]|ENEEDAUTH|EOTP|403|401|404|provenance|OIDC|otp' /tmp/publish.log \
            | head -n 40 | cut -c1-300 | while IFS= read -r line; do
                echo "::error::npm-error: $line"
              done
          tail -n 25 /tmp/publish.log | cut -c1-300 | while IFS= read -r line; do
            echo "::error::npm-tail: $line"
          done
          exit 1

      # Ask the registry what actually landed instead of trusting npm's exit
      # code: a green step that shipped nothing is the failure mode this
      # workflow exists to rule out.
      - name: Confirm the version is on the registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').name")
          V="${GITHUB_REF_NAME#v}"
          echo "checking registry for $PKG@$V"
          for i in 1 2 3 4 5 6 7 8 9; do
            FOUND=$(npm view "$PKG@$V" version 2>/dev/null || true)
            if [ "$FOUND" = "$V" ]; then
              echo "OK: $PKG@$V is published"
              exit 0
            fi
            echo "not visible yet (attempt $i), waiting 10s"
            sleep 10
          done
          echo "::error::$PKG@$V is not on the registry after publishing"
          exit 1
